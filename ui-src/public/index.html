<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <script>
      (function () {
        function report(prefix, detail) {
          var msg = prefix + ': ' + detail;
          try {
            if (window.__TAURI__ && window.__TAURI__.core) {
              window.__TAURI__.core.invoke('log_frontend_error', { message: msg }).catch(function () {});
            }
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          report('window.onerror', (e.error && (e.error.stack || e.error.message)) || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          report('unhandledrejection', (reason && (reason.stack || reason.message)) || String(reason));
        });
      })();
    </script>
  </head>
  <body style="height: 100vh">
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
