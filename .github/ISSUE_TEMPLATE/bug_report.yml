name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Voxpad version
      placeholder: "0.2.8"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Contents of `data/voxpad.log` next to the executable, if relevant.
      render: text
